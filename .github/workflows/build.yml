name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:win -- --publish never
      - uses: actions/upload-artifact@v4
        with: { name: mashhadaya-windows, path: release/*.exe }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      # لتوقيع ثابت بين الإصدارات أضف السرّين ANDROID_KEYSTORE_BASE64 و ANDROID_KEYSTORE_PASS في إعدادات المستودع
      - name: keystore
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        if: env.KS != ''
        run: echo "$KS" | base64 -d > android/release.p12
      - run: npm run dist:android
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS || 'mashhadaya' }}
      - uses: actions/upload-artifact@v4
        with: { name: mashhadaya-android, path: release/*.apk }
      - uses: actions/upload-artifact@v4
        with: { name: mashhadaya-web, path: dist }
  release:
    # ينشر إصدارًا على GitHub لكل رقم إصدار جديد في package.json، فيجده تنبيه التحديث داخل التطبيق
    needs: [windows, android]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: exists
        env: { GH_TOKEN: '${{ github.token }}' }
        run: if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then echo "yes=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.exists.outputs.yes != '1'
        uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true, pattern: 'mashhadaya-{windows,android}' }
      - if: steps.exists.outputs.yes != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: مَشهَدآية ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
